<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page moved | Love n' Learn Childcare</title>
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages serves this file for retired URLs. Send visitors to the
    // matching section of the current site while search engines update links.
    const oldAddress = (location.pathname + location.search).toLowerCase();
    const destinations = [
      [/toddler/, '#program-card-toddler'],
      [/infant/, '#program-card-infant'],
      [/preschool/, '#program-card-preschool'],
      [/pre.?regist|pre.?register|wait.?list|enrol|registration/, '#contact'],
      [/contact|location/, '#contact'],
      [/team|staff/, '#about']
    ];
    const destination = destinations.find(([pattern]) => pattern.test(oldAddress));
    if (destination) location.replace('/' + destination[1]);
  </script>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #1e293b; background: #fffdf8; }
    body { margin: 0; }
    header { background: white; border-bottom: 1px solid #fed7aa; padding: 14px max(20px, calc((100vw - 1100px) / 2)); }
    header img { display: block; width: min(230px, 70vw); height: auto; }
    main { max-width: 680px; margin: 7vh auto; padding: 0 24px; text-align: center; }
    h1 { font-size: clamp(1.7rem, 5vw, 2.5rem); margin-bottom: .4em; }
    p { line-height: 1.6; color: #475569; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
    nav a { background: #fff1f2; color: #9f1239; border-radius: 12px; padding: 12px 16px; font-weight: 700; text-decoration: none; }
    nav a:hover, nav a:focus-visible { background: #ffe4e6; }
  </style>
</head>
<body>
  <header><a href="/"><img src="/Logo-Final.jpg" alt="Love n' Learn Childcare Centre"></a></header>
  <main>
    <h1>This page has moved</h1>
    <p>Our website has been updated. Find the information you need on the current site.</p>
    <nav aria-label="Current pages">
      <a href="/">Home</a>
      <a href="/#programs">Programs</a>
      <a href="/#about">About us</a>
      <a href="/#contact">Contact &amp; waiting list</a>
    </nav>
  </main>
</body>
</html>
